# Release a PyPI — Trusted Publishers (OIDC), cero secretos en el repo.
#
# Flujo (AST-22): push de tag `v*` → gates (scan + metadata + suite) →
# `uv build` → publicación con pypa/gh-action-pypi-publish vía OIDC.
#
# PROD GATE en forma GitHub: el job `publish` corre en el environment `pypi`
# con required reviewer (lo configura el Socio en GitHub Settings →
# Environments). Cada release la aprueba el Socio con un clic en la UI,
# igual que su `prod-go`. Sin aprobación, no hay publish.
#
# Fail-closed por diseño: hasta que el Socio registre el Trusted Publisher en
# PyPI (owner/repo/workflow/environment), el job `publish` falla en el
# intercambio OIDC — eso ES la validación de que no publica nada por accidente.
#
# GitHub Release (AST-23): tras publicar, el job `github-release` crea la
# Release del tag con las notas EXTRAÍDAS de CHANGELOG.md — fuente única de
# verdad, nada de notas escritas a mano ni PR-lists de GitHub. Antes la
# creaba la mano derecha a mano: v0.7.8 siguió de "Latest" cinco horas
# después de publicar 0.8.0.
#
# La CI completa (ci.yml) también corre sobre el tag: `on: push` incluye tags,
# así que el SHA publicado lleva wheel-verify + smoke [mcp] además de estos gates.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Gates + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Secret scan (full tree)
        run: uv run python scripts/check_secrets.py --all
      - name: Validate metadata
        # Fail si README/CHANGELOG/pyproject divergen (doctrina de fuente única)
        run: uv run python scripts/validate_metadata.py
      - name: Run tests
        run: uv run pytest -q
      - name: Build distributions
        run: uv build
      - name: Check distributions
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (OIDC)
    needs: build
    runs-on: ubuntu-latest
    # PROD GATE: environment con required reviewer — aprobación del Socio por UI
    environment: pypi
    permissions:
      # OIDC Trusted Publishers: el token se emite por intercambio OIDC,
      # no hay ningún secreto persistente en el repo ni en GitHub Settings.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release (notas del CHANGELOG)
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      # Mínimo privilegio: sólo este job escribe en el repo, y sólo para
      # crear el objeto Release sobre el tag YA publicado en PyPI. Ni el
      # workflow ni `publish` ganan scopes de más.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG
        # El tag manda: si CHANGELOG no tiene la entrada de ESA versión, el
        # job falla antes de crear una Release vacía o desincronizada.
        run: |
          python - <<'PY'
          import os, re, sys
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag[1:] if tag.startswith("v") else tag
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\] - [^\n]*\n(.*?)(?=^## \[|\Z)",
              changelog,
              re.M | re.S,
          )
          if not match:
              sys.exit(f"CHANGELOG.md no tiene entrada ## [{version}] para el tag {tag}")
          Path("release-notes.md").write_text(
              match.group(1).strip() + "\n", encoding="utf-8"
          )
          PY
          echo "--- release-notes.md ---"
          cat release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine pytest
      - name: Secret scan (full tree)
        # T8: escanea TODOS los ficheros trackeados, no solo los staged
        # (el modo staged sigue siendo el que corre el hook .githooks/pre-commit).
        run: python scripts/check_secrets.py --all
      - name: Validate metadata
        run: python scripts/validate_metadata.py
      - name: README claims gate
        # AST-33: verdad ejecutable del README — fail cerrado. Sin credenciales;
        # única red permitida: pypi.org (API JSON).
        run: python scripts/check_readme_claims.py
      - name: Run tests
        run: python -m pytest -q
      - name: Build wheel
        run: python -m build --wheel
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Verify packaged resource
        run: |
          python - <<'PY'
          import glob
          import os
          import subprocess
          import sys
          import tempfile
          import venv
          from importlib import resources
          from pathlib import Path

          wheel = sorted(glob.glob('dist/*.whl'))[-1]
          env_dir = Path(tempfile.mkdtemp(prefix='bytia-wheel-'))
          venv.create(env_dir, with_pip=True)
          py = env_dir / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          subprocess.check_call([str(py), '-m', 'pip', 'install', wheel])
          code = "from importlib import resources; r = resources.files('bytia_kode.prompts').joinpath('kernel.default.yaml'); print(r.is_file())"
          output = subprocess.check_output([str(py), '-c', code], text=True).strip()
          if output != 'True':
              raise SystemExit('kernel.default.yaml no está disponible como recurso empaquetado')
          PY
      - name: Smoke test [mcp] extra
        # Caza D2 (AST-8): con el extra [mcp] instalado, `import bytia_kode.mcp`
        # debe funcionar aunque mcp/manager.py siga en WIP.
        run: |
          python - <<'PY'
          import glob
          import os
          import subprocess
          import tempfile
          import venv
          from pathlib import Path

          wheel = sorted(glob.glob('dist/*.whl'))[-1]
          env_dir = Path(tempfile.mkdtemp(prefix='bytia-mcp-smoke-'))
          venv.create(env_dir, with_pip=True)
          py = env_dir / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          subprocess.check_call([str(py), '-m', 'pip', 'install', f'{wheel}[mcp]'])
          subprocess.check_call([str(py), '-c', 'import bytia_kode.mcp; print("import bytia_kode.mcp OK")'])
          PY
